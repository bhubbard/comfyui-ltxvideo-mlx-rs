[package]
name = "comfyui-ltxvideo-mlx"
version = "0.1.1"
edition = "2021"
authors = ["Brandon Hubbard <bhubbard@users.noreply.github.com>"]
description = "High-performance LTX-Video 2.3 runtime, ComfyUI node engine & DiT sampler for Apple Silicon (Rust fork of dgrauet/ComfyUI-LTXVideo-mlx)"
repository = "https://github.com/bhubbard/comfyui-ltxvideo-mlx-rs"
homepage = "https://code.brandonhubbard.com/comfyui-ltxvideo-mlx-rs/"
documentation = "https://docs.rs/comfyui-ltxvideo-mlx"
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["ltx-video", "apple-silicon", "mlx", "comfyui", "video-generation"]
categories = ["multimedia::video", "science::robotics", "command-line-utilities"]

[lib]
name = "ltxvideo"
path = "src/lib.rs"

[[bin]]
name = "ltxvideo"
path = "src/bin/ltxvideo.rs"

[dependencies]
clap = { version = "4.5", features = ["derive", "env", "cargo"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
indicatif = { version = "0.17", features = ["rayon"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
half = { version = "2.4", features = ["serde"] }
safetensors = "0.5"
memmap2 = "0.9"
tokio = { version = "1.43", features = ["full"] }
rayon = "1.10"
dirs = "6.0"
chrono = { version = "0.4", features = ["serde"] }
byteorder = "1.5"

[dev-dependencies]
tempfile = "3.17"
